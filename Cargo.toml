[package]
name = "reclaim"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["matkeedev"]
description = "Fast TUI to find and reclaim disk space from dev junk: node_modules, target/, __pycache__ and more"
license = "MIT"
repository = "https://github.com/matkeedev/reclaim"
keywords = ["cli", "tui", "disk", "cleanup", "node-modules"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
anstyle = "=1.0.6"
crossterm = "=0.27.0"
ratatui = "=0.26.3"
walkdir = "2.4"
rayon = "=1.8.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
